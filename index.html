<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457c5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spese">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Spese Mensili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra di navigazione fissa, poi colonna unica di schede; numeri sempre allineati in colonna */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#f7f8fb; --text:#171b24; --muted:#636b7a; --line:#e2e6ec;
  --accent:#2457c5; --accent-soft:#e2eafb;
  --in:#0d8a60; --in-soft:#d3f0e4; --out:#c8394f; --out-soft:#fbe0e5; --warn:#9a5306; --warn-soft:#fcefd8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --panel:#171b23; --panel-2:#1c212b; --text:#e6e9ef; --muted:#9aa2b0; --line:#2a303c;
    --accent:#7aa2ff; --accent-soft:#1d2944;
    --in:#3cc89a; --in-soft:#133227; --out:#f0738a; --out-soft:#3b1b23; --warn:#f2b155; --warn-soft:#3a2b13;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --panel-2:#1c212b; --text:#e6e9ef; --muted:#9aa2b0; --line:#2a303c;
  --accent:#7aa2ff; --accent-soft:#1d2944;
  --in:#3cc89a; --in-soft:#133227; --out:#f0738a; --out-soft:#3b1b23; --warn:#f2b155; --warn-soft:#3a2b13;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-b)}
h2,h3,.brand,.kpi .val,.yr,.dlg-h h3{font-family:var(--font-d);text-wrap:balance}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;min-width:0}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--panel-2);color:var(--text)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.status{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.ok{color:var(--in)} .pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:grid;gap:14px}
.stack>*,.grid>*,.row>*{min-width:0}
select{max-width:100%}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--in)} .neg{color:var(--out)} td.warn{color:var(--warn)}
.docgrid th.num,.docgrid td.num{text-align:center;min-width:34px}
.two{grid-template-columns:1.25fr 1fr} @media(max-width:900px){.two{grid-template-columns:1fr}}
.three{grid-template-columns:repeat(3,1fr)} @media(max-width:900px){.three{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 12px} h3{font-size:14px;margin:0 0 8px}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 -4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out)}
.btn.dangerfill{background:var(--out);border-color:var(--out);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
input[type=color]{padding:2px;width:34px;height:30px}
select.inl{padding:3px 6px;font-size:12px;max-width:210px;background:transparent}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover td{background:var(--panel-2)}
tr.clk{cursor:pointer}
tr.sel td{background:var(--accent-soft)!important}
tfoot td{font-weight:700;border-bottom:0}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tblwrap.tall{max-height:560px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.badge.fc{background:var(--accent-soft);color:var(--accent)}
tr.fc td{color:var(--muted)}
tr.fc td.desc{font-style:italic}
.months{display:flex;gap:4px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.months button.fut{border-style:dashed;color:var(--muted)}
.months button.on{background:var(--accent);color:#fff;border-color:var(--accent);border-style:solid}
.yr{font-size:18px;font-weight:700;min-width:52px;text-align:center}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.dlg-h h3{margin:0;font-size:16px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.form label,.lab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
@media(max-width:520px){.form{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--text);font:inherit;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.out{background:var(--out)} .seg button.on.in{background:var(--in)}
.seg.big button{padding:8px 20px;font-weight:600}
.cats .crow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:7px 4px;border-radius:8px;cursor:pointer}
.cats .crow:hover{background:var(--panel-2)}
.cbar{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;display:flex}
.cbar span{display:block;height:100%}
.cname{display:flex;align-items:center;gap:7px;min-width:0}
.cname b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--text)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.16);z-index:50;display:none;min-width:190px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.muted{color:var(--muted)} .small{font-size:12px} .nowrap{white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.sw-in{background:var(--in)} .sw-out{background:var(--out)}
.sw-fc{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px);border:1px solid var(--muted)}
#chart svg{display:block}
#chart .ax{font-size:11px;fill:var(--muted)}
#chart .axon{fill:var(--accent);font-weight:700}
.upc{display:grid;gap:2px}
.upc .u{display:grid;grid-template-columns:62px 1fr auto auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.upc .u:last-child{border-bottom:0}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
td.hl{background:var(--accent-soft)}
.kw{width:100%}
.jars{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.banner.ok{background:var(--in-soft);color:var(--text)}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.paysplit{grid-template-columns:1fr 1fr}
.payval{font-family:var(--font-d,inherit);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
code{background:var(--panel-2);padding:1px 5px;border-radius:5px;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
html{-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:640px){input,select,textarea{font-size:16px}main{padding:12px}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px}.kpi .val{font-size:19px}}
.gate{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
.gate h1{font-family:var(--font-d);font-size:26px;margin:0}
.gate form{display:grid;gap:10px}
.gate label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.gate .err{color:var(--out);font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">Spese Mensili</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="status" id="status"></div>
</div></header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<datalist id="accList"></datalist>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>
<input type="file" id="invFile" accept=".pdf,application/pdf" multiple hidden>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ============ utilità ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round(n*100)/100;
let EURF;try{EURF=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',useGrouping:'always'});EURF.format(1)}catch{EURF=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'})}
const eur=n=>EURF.format(round2(n||0));
const eurK=n=>Math.abs(n)>=1000?(n/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k':String(Math.round(n));
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI3=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const fmtDate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const fmtShort=s=>s.slice(8,10)+' '+MESI3[+s.slice(5,7)-1];
const monthLabel=k=>MESI[+k.slice(5,7)-1]+' '+k.slice(0,4);
const FREQ={w:'Settimanale','2w':'Ogni 2 settimane',m:'Mensile','2m':'Bimestrale','3m':'Trimestrale','6m':'Semestrale',y:'Annuale'};
const FREQ_M={w:52/12,'2w':26/12,m:1,'2m':1/2,'3m':1/3,'6m':1/6,y:1/12};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
/* ============ categorie predefinite ============ */
const DEFAULT_CATS=[
 ['Spesa alimentare','uscita','#16a34a','COOP,CONAD,ESSELUNGA,CARREFOUR,LIDL,EUROSPIN,PAM,IPERCOOP,ALDI,PENNY,TIGROS,BENNET,DESPAR,EUROSPAR,SIGMA,CRAI,FAMILA,IPER,UNICOOP,PANORAMA,SIMPLY,TODIS,MARKET,SUPERMERCATO,MACELLERIA,PANIFICIO,FRUTTA'],
 ['Casa (affitto, mutuo, condominio)','uscita','#2563eb','AFFITTO,CONDOMINIO,MUTUO,RATA MUTUO,LOCAZIONE'],
 ['Utenze e telefono','uscita','#0891b2','ENEL,HERA,A2A,IREN,EDISON,PLENITUDE,SORGENIA,ACEA,ENGIE,TIM,VODAFONE,WINDTRE,WIND TRE,FASTWEB,ILIAD,HO MOBILE,VERY MOBILE,SKY,BOLLETTA'],
 ['Auto e trasporti','uscita','#ca8a04','ENI,Q8,TAMOIL,ESSO,IP,API,AUTOSTRAD,TELEPASS,TRENITALIA,ITALO,ATM,UBER,FREE NOW,PARCHEGG,CARBURANT,BENZINA,TAGLIANDO,GOMMISTA,DISTRIBUTORE,BEYFIN,EASYPARK,TOTALERG,KUWAIT'],
 ['Ristoranti e bar','uscita','#ea580c','RISTORANTE,PIZZERIA,TRATTORIA,OSTERIA,BAR,CAFFE,MCDONALD,BURGER KING,DELIVEROO,GLOVO,JUST EAT,SUSHI,GELATERIA,PASTICCERIA'],
 ['Salute','uscita','#dc2626','FARMACIA,PARAFARMACIA,OSPEDALE,ASL,DENTIST,OTTICA,ANALISI,TICKET SANITARIO,MEDICO'],
 ['Abbonamenti e servizi digitali','uscita','#7c3aed','NETFLIX,SPOTIFY,AMAZON PRIME,PRIME VIDEO,DISNEY,APPLE.COM,ITUNES,DAZN,NOW TV,YOUTUBE,MICROSOFT,ADOBE,DROPBOX,ICLOUD,OPENAI,ANTHROPIC'],
 ['Shopping e abbigliamento','uscita','#db2777','AMAZON,AMZN,ZALANDO,ZARA,H&M,DECATHLON,IKEA,MEDIAWORLD,UNIEURO,EBAY,PAYPAL,OVS,PRIMARK,BRICOMAN,OBI,TECNOMAT,BRICO,LEROY MERLIN,LEGNAMI,EUROBRICO'],
 ['Svago e viaggi','uscita','#0d9488','BOOKING,AIRBNB,RYANAIR,EASYJET,ITA AIRWAYS,CINEMA,TEATRO,TICKETONE,HOTEL,PALESTRA'],
 ['Istruzione e figli','uscita','#4f46e5','SCUOLA,UNIVERSITA,LIBRERIA,MENSA,ASILO'],
 ['Tasse, commissioni e banca','uscita','#64748b','F24,COMMISSION,CANONE,IMPOSTA DI BOLLO,SPESE TENUTA,INTERESSI DEBITORI,AGENZIA ENTRATE,PAGOPA,BOLLO'],
 ['Rate e finanziamenti','uscita','#b45309','PIANO MULTISPESA,RATA N,FINDOMESTIC,COMPASS,AGOS,COFIDIS,SANTANDER CONSUMER,KLARNA,SCALAPAY'],
 ['Prelievi contanti','uscita','#94a3b8','PRELIEVO,PRELEVAMENTO,ATM CASH'],
 ['Altre uscite','uscita','#a1a1aa',''],
 ['Stipendio','entrata','#059669','STIPENDIO,EMOLUMENTI,RETRIBUZIONE,SALARY,PAYROLL,CEDOLINO'],
 ['Rimborsi','entrata','#10b981','RIMBORSO,STORNO,REFUND'],
 ['Altre entrate','entrata','#34d399',''],
 ['Giroconto / addebito carta (escluso)','giroconto','#9ca3af','GIROCONTO,SALDO CARTA,ADDEBITO CARTA,ADDEBITO ESTRATTO CONTO,RICARICA CARTA,PAGAMENTO CARTA DI CREDITO,ADDEBITO SALDO,NEXI,CARTASI,AMERICAN EXPRESS'],
];
const defaultCats=()=>DEFAULT_CATS.map(([name,kind,color,keywords],i)=>({id:'k'+i,name,kind,color,keywords}));
function defaultState(){
  return {v:1,catVer:2,categories:defaultCats(),movements:[],recurring:[],learn:{},imports:[],holders:{},accAlias:{},docs:[],docMarks:{},jars:[],positions:[],trades:[]};
}
function normalize(d){
  const s=Object.assign(defaultState(),d||{});
  for(const k of ['categories','movements','recurring','imports']) if(!Array.isArray(s[k])) s[k]=[];
  if(!s.learn||typeof s.learn!=='object') s.learn={};
  if(!s.holders||typeof s.holders!=='object') s.holders={};
  if(!s.accAlias||typeof s.accAlias!=='object') s.accAlias={};
  if(!Array.isArray(s.docs)) s.docs=[];
  if(!s.docMarks||typeof s.docMarks!=='object') s.docMarks={};
  if(!Array.isArray(s.jars)) s.jars=[];
  if(!Array.isArray(s.positions)) s.positions=[];
  if(!Array.isArray(s.trades)) s.trades=[];
  s.recurring.forEach(r=>{if(!Array.isArray(r.skip)) r.skip=[]});
  if((s.catVer||1)<2){ // aggiunge le nuove parole chiave e categorie predefinite ai dati già salvati
    DEFAULT_CATS.forEach(([name,kind,color,kw],i)=>{
      const c=s.categories.find(x=>x.name===name);
      if(c){const have=new Set((c.keywords||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean));const add=kw.split(',').filter(k=>k&&!have.has(k));if(add.length) c.keywords=[c.keywords,add.join(',')].filter(Boolean).join(',')}
      else if(name==='Rate e finanziamenti'){const at=s.categories.findIndex(x=>x.name.startsWith('Prelievi'));s.categories.splice(at<0?s.categories.length:at,0,{id:uid(),name,kind,color,keywords:kw})}
    });
    s.catVer=2;
  }
  return s;
}
let S=defaultState();
let rev=0;

/* ============ dati su Supabase ============
   Tabella items (kind, id, data):  mov = un movimento · rec = una ricorrente · imp = un'importazione
   cfg = configurazione: categories {list}, learn {map}, cards {holders, alias}, jars {list}, docs {list, marks} (estratti attesi ogni mese e mesi segnati a mano).
   Leggono e scrivono solo gli account con l'email nella tabella members (regole nel database). */
const CFG=window.SPESE_CONFIG||{};
const DB={sb:null,user:null,state:'loading',ready:false,ro:false,pending:0,dirty:false,needReload:false,err:'',
  remote:null,base:{mov:new Map(),rec:new Map(),imp:new Map(),inv:new Map(),trd:new Map(),cats:'',learn:'{}',holders:'{}',jars:'[]',docs:'{"l":[],"m":{}}'},q:Promise.resolve()};

resetRemote();
const normMov=m=>({id:m.id,date:m.date,desc:m.desc||'',amount:round2(+m.amount||0),type:m.type==='entrata'?'entrata':'uscita',cat:m.cat||'',account:m.account||'',note:m.note||'',recId:m.recId||'',occ:m.occ||'',imp:m.imp||'',mese:m.mese||''});
const normPos=p=>({id:p.id,isin:p.isin||'',name:p.name||'',kind:p.kind||'azione',qty:+p.qty||0,avg:p.avg==null||p.avg===''?null:+p.avg,refPrice:p.refPrice==null?null:+p.refPrice,refDate:p.refDate||'',newsQuery:p.newsQuery||'',cgId:p.cgId||'',broker:p.broker||'',archived:!!p.archived,...(p.symbol?{symbol:p.symbol}:{}),...(p.kind==='gestita'?{values:p.values||{},isins:p.isins||[],paidAt:p.paidAt||''}:{})});
const normTrade=t=>({id:t.id,pos:t.pos||'',date:t.date||'',type:t.type||'buy',qty:+t.qty||0,price:t.price==null||t.price===''?null:+t.price,amount:t.amount==null||t.amount===''?null:+t.amount,fees:+t.fees||0,taxes:+t.taxes||0,src:t.src||'',ref:t.ref||'',note:t.note||'',broker:t.broker||(/trade republic|estratto del patrimonio/i.test(t.src||'')?'Trade Republic':''),currency:t.currency||'EUR',fx:t.fx==null||t.fx===''?1:+t.fx});
const normRec=r=>({id:r.id,name:r.name||'',type:r.type==='entrata'?'entrata':'uscita',amount:round2(+r.amount||0),freq:r.freq||'m',start:r.start||'',end:r.end||'',cat:r.cat||'',account:r.account||'',paused:!!r.paused,skip:Array.isArray(r.skip)?[...r.skip]:[]});
function setRemote(kind,id,data){
  const R=DB.remote;
  if(kind==='mov'||kind==='rec'||kind==='imp'||kind==='inv'||kind==='trd'||kind==='mkt'){if(data) R[kind].set(id,{...data,id});else R[kind].delete(id);return}
  if(kind!=='cfg') return;
  if(id==='categories') R.cats=data||null;
  else if(id==='learn') R.learn=data?{...(data.map||{})}:null;
  else if(id==='cards'){R.holders=data?{...(data.holders||{})}:null;R.alias=data?{...(data.alias||{})}:null}
  else if(id==='jars') R.jars=data?(data.list||[]).map(x=>({...x})):null;
  else if(id==='docs') R.docs=data?{list:(data.list||[]).map(x=>({...x})),marks:{...(data.marks||{})}}:null;
}
function applyRemote(){
  const R=DB.remote,B=DB.base;
  S.movements=[...R.mov.values()].filter(m=>m&&m.date).map(normMov);B.mov=new Map(S.movements.map(m=>[m.id,JSON.stringify(m)]));
  S.recurring=[...R.rec.values()].map(normRec);B.rec=new Map(S.recurring.map(r=>[r.id,JSON.stringify(r)]));
  S.imports=[...R.imp.values()].map(x=>({...x})).sort((a,b)=>(b.ts||0)-(a.ts||0));B.imp=new Map(S.imports.map(i=>[i.id,JSON.stringify(i)]));
  S.categories=R.cats&&Array.isArray(R.cats.list)?R.cats.list.map(c=>({...c})):defaultCats();B.cats=R.cats?JSON.stringify(S.categories):'';
  S.learn={...(R.learn||{})};B.learn=JSON.stringify(S.learn);
  S.holders={...(R.holders||{})};S.accAlias={...(R.alias||{})};B.holders=JSON.stringify({h:S.holders,a:S.accAlias});
  S.jars=(R.jars||[]).map(j=>({...j}));B.jars=JSON.stringify(S.jars);
  S.docs=(R.docs?.list||[]).map(d=>({...d}));S.docMarks={...(R.docs?.marks||{})};B.docs=JSON.stringify({l:S.docs,m:S.docMarks});
  S.positions=[...R.inv.values()].map(normPos);B.inv=new Map(S.positions.map(p=>[p.id,JSON.stringify(p)]));
  S.trades=[...R.trd.values()].map(normTrade);B.trd=new Map(S.trades.map(t=>[t.id,JSON.stringify(t)]));
  rev++;cacheSoon();
}
function persist(){ // confronta con l'ultima versione salvata e manda solo quello che è cambiato
  const B=DB.base,R=DB.remote,ups=[],dels=[];
  const sync=(kind,list,norm)=>{const seen=new Set();
    for(const x of list){const o=norm(x),j=JSON.stringify(o);seen.add(o.id);if(B[kind].get(o.id)!==j){B[kind].set(o.id,j);R[kind].set(o.id,o);ups.push({kind,id:o.id,data:o})}}
    for(const id of [...B[kind].keys()]) if(!seen.has(id)){B[kind].delete(id);R[kind].delete(id);dels.push([kind,id])}};
  sync('mov',S.movements,normMov);sync('rec',S.recurring,normRec);sync('imp',S.imports,x=>({...x}));sync('inv',S.positions||[],normPos);sync('trd',S.trades||[],normTrade);
  const cfg=(key,id,val,wrap)=>{const j=JSON.stringify(val);if(j!==B[key]){B[key]=j;const data=wrap(JSON.parse(j));setRemote('cfg',id,data);ups.push({kind:'cfg',id,data})}};
  cfg('cats','categories',S.categories,list=>({list,catVer:2}));
  cfg('learn','learn',S.learn||{},map=>({map}));
  cfg('holders','cards',{h:S.holders||{},a:S.accAlias||{}},v=>({holders:v.h,alias:v.a}));
  cfg('jars','jars',S.jars||[],list=>({list}));
  cfg('docs','docs',{l:S.docs||[],m:S.docMarks||{}},v=>({list:v.l,marks:v.m}));
  if(ups.length||dels.length) write(ups,dels);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const denied=e=>e&&(e.code==='42501'||/row-level security|permission denied/i.test(e.message||''));
function write(ups,dels){
  DB.pending++;updateStatus();
  const run=async()=>{
    for(let i=0;i<ups.length;i+=500){const {error}=await DB.sb.from('items').upsert(ups.slice(i,i+500),{onConflict:'kind,id'});if(error) throw error}
    const by={};dels.forEach(([k,id])=>(by[k]||=[]).push(id));
    for(const [k,ids] of Object.entries(by)) for(let i=0;i<ids.length;i+=200){const {error}=await DB.sb.from('items').delete().eq('kind',k).in('id',ids.slice(i,i+200));if(error) throw error}
  };
  DB.q=DB.q.then(async()=>{try{await run()}catch(e){if(denied(e)) throw e;await sleep(800+Math.random()*800);await run()}})
    .catch(writeFailed)
    .finally(()=>{DB.pending--;if(!DB.pending){if(DB.needReload){DB.needReload=false;DB.dirty=false;refresh()}else if(DB.dirty){DB.dirty=false;applyRemote();renderKeep()}}updateStatus()});
}
function writeFailed(e){
  console.error(e);
  if(denied(e)){DB.ro=true;toast('Il tuo account non può modificare i dati: la modifica non è stata salvata')}
  else toast('Salvataggio non riuscito: controlla la connessione. Ricarico i dati dal server.');
  DB.needReload=true;
}

  if(!DB.sb||!DB.user){rev++;render();return}

  if(DB.ro){toast('Sola lettura: puoi vedere i dati ma non modificarli');applyRemote();render();return}
  persist();rev++;render();
}
function renderKeep(){ // ridisegna senza perdere il cursore nel campo in cui si sta scrivendo
  const a=document.activeElement,id=a?.id,s=a?.selectionStart,e=a?.selectionEnd;

}
async function loadAll(){ // legge tutto, a pagine da 1000 righe

  }

}

function subscribe(){
  if(DB.chan) DB.sb.removeChannel(DB.chan);
  DB.chan=DB.sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
    const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.kind) return;
    setRemote(row.kind,row.id,p.eventType==='DELETE'?null:row.data);
    if(DB.pending){DB.dirty=true;return}
    if(DB.ready){applyRemote();renderKeep()}
  }).subscribe();
}

  if(!DB.ready&&await loadCache(user.email)){DB.ready=true;DB.state='syncing';applyRemote();render()}

/* ============ regole di categorizzazione ============ */
const NOISE=new Set('PAGAMENTO PAGAMENTI POS CARTA CARTE PRESSO ACQUISTO ACQUISTI OPERAZIONE DEL DELLA DELLO IL LO LA LE DI DA AL ORE NR NUM CON SU IN PER TRAMITE PAY CONTACTLESS EUR EURO ITA IT ITALIA BONIFICO SEPA DISPOSTO FAVORE VOSTRO ADDEBITO DIRETTO SDD RID CRO TRN RIF DATA VALUTA MAESTRO VISA MASTERCARD DEBIT DEBITO CREDITO BANCOMAT CIRCUITO INTERNAZIONALE NAZIONALE IMPORTO TRANSAZIONE SPA SRL SRLS SNC SAS PAGOBANCOMAT INSTANT ISTANTANEO ORDINANTE BENEFICIARIO'.split(' '));
function learnKey(desc){return String(desc||'').toUpperCase().replace(/[^A-ZÀ-Ü ]+/g,' ').split(/\s+/).filter(w=>w.length>1&&!NOISE.has(w)).slice(0,2).join(' ')}
function learn(desc,catId){const k=learnKey(desc);if(k&&catId) S.learn[k]=catId}
const kwCache=new Map();
function kwRegex(c){
  const k=c.id+'|'+(c.keywords||'');
  if(kwCache.has(k)) return kwCache.get(k);
  const parts=(c.keywords||'').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean)
    .map(w=>{const e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return w.length<=3?e+'(?![A-Z0-9])':e});
  const re=parts.length?new RegExp('(?:^|[^A-Z0-9])(?:'+parts.join('|')+')'):null;
  kwCache.set(k,re);return re;
}
function guessCat(desc,type){
  if(!desc) return '';
  const k=learnKey(desc),l=k&&S.learn[k];
  if(l){const c=cat(l);if(c&&(c.kind===type||c.kind==='giroconto')) return l;if(jarOf(l)) return l}
  const up=String(desc).toUpperCase();
  for(const c of [...S.categories.filter(c=>c.kind==='giroconto'),...S.categories.filter(c=>c.kind===type)]){
    const re=kwRegex(c);if(re&&re.test(up)) return c.id;
  }
  return '';
}

/* ============ ricorrenti e previsioni ============ */
function recDates(r,from,to){
  const out=[];if(!r.start) return out;
  const end=r.end&&r.end<to?r.end:to;
  if(r.freq==='w'||r.freq==='2w'){
    const step=r.freq==='w'?7:14,d=pISO(r.start),f=pISO(from);
    if(d<f) d.setDate(d.getDate()+Math.floor((f-d)/864e5/step)*step);
    for(let i=0;i<5000;i++){const s=iso(d);if(s>end) break;if(s>=from) out.push(s);d.setDate(d.getDate()+step)}
  }else{
    const step={m:1,'2m':2,'3m':3,'6m':6,y:12}[r.freq]||1,s0=pISO(r.start),day=s0.getDate();
    for(let k=0;k<3000;k++){
      const mm=s0.getMonth()+k*step,y=s0.getFullYear()+Math.floor(mm/12),m=mm%12;
      const s=y+'-'+pad(m+1)+'-'+pad(Math.min(day,lastDay(y,m)));
      if(s>end) break;if(s>=from) out.push(s);
    }
  }
  return out;
}
/* Una scadenza è "coperta" se esiste un movimento collegato (registrato da qui) oppure
   un movimento simile: stesso tipo e categoria, importo ±10%, data vicina (es. arrivato dall'estratto conto). */
const fcCache=new Map();
function forecastsBetween(from,to){
  const key=rev+'|'+from+'|'+to;
  if(fcCache.has(key)) return fcCache.get(key);
  if(fcCache.size>40) fcCache.clear();
  const curStart=today().slice(0,8)+'01',f=from>curStart?from:curStart,out=[];
  if(f<=to&&S.recurring.length){
    const linked=new Set(S.movements.filter(m=>m.recId).map(m=>m.recId+'|'+m.occ));
    const used=new Set();
    for(const r of S.recurring){
      if(r.paused) continue;
      const tol=r.freq==='w'?3:r.freq==='2w'?6:8;
      for(const d of recDates(r,addDays(f,-0),to)){
        if((r.skip||[]).includes(d)||linked.has(r.id+'|'+d)) continue;
        if(matchMov(r,d,tol,used)) continue;
        out.push({id:'fc:'+r.id+':'+d,date:d,desc:r.name,amount:r.amount,type:r.type,cat:r.cat,account:r.account||'',fc:true,recId:r.id,occ:d});
      }
    }
  }
  fcCache.set(key,out);return out;
}
function matchMov(r,d,tol,used){
  const lo=addDays(d,-tol),hi=addDays(d,tol),lim=Math.max(1,r.amount*0.1);
  for(const m of S.movements){
    if(m.date<lo||m.date>hi||used.has(m.id)||m.recId||m.type!==r.type) continue;
    if(r.cat&&m.cat!==r.cat) continue;
    if(Math.abs(m.amount-r.amount)>lim) continue;
    used.add(m.id);return true;
  }
  return false;
}
function nextOcc(r){const t=today();return recDates(r,t,addDays(t,800)).find(d=>!(r.skip||[]).includes(d))||''}

/* ============ aggregazioni ============ */
function yearData(y){
  const b=Array.from({length:12},()=>({inR:0,outR:0,inF:0,outF:0}));
  const pre=y+'-';
  for(const m of S.movements){const mm=effMonth(m);if(!mm.startsWith(pre)||excl(m)) continue;const i=+mm.slice(5,7)-1;m.type==='entrata'?b[i].inR+=m.amount:b[i].outR+=m.amount}
  for(const f of forecastsBetween(y+'-01-01',y+'-12-31')){if(excl(f)) continue;const i=+f.date.slice(5,7)-1;f.type==='entrata'?b[i].inF+=f.amount:b[i].outF+=f.amount}
  return b;
}
function catBreakdown(from,to,type){
  const map=new Map(),add=(c,k,v)=>{if(!map.has(c)) map.set(c,{r:0,f:0});map.get(c)[k]+=v};
  for(const m of S.movements){const mm=effMonth(m);if(m.type===type&&mm>=from.slice(0,7)&&mm<=to.slice(0,7)&&!excl(m)) add(m.cat,'r',m.amount)}
  for(const f of forecastsBetween(from,to)){if(f.type===type&&!excl(f)) add(f.cat,'f',f.amount)}
  return [...map.entries()].map(([c,v])=>({cat:c,...v,t:v.r+v.f})).sort((a,b)=>b.t-a.t);
}

/* spesa per carta e per conto; su una carta un'entrata è uno storno e riduce la spesa */
function spendByAccount(from,to){
  const conto=new Set((S.docs||[]).filter(d=>d.kind==='conto'&&d.account).map(d=>resolveAcc(d.account)));
  const map=new Map(),get=k=>{k=conto.has(k)?'':k;if(!map.has(k)) map.set(k,{acc:k,r:0,f:0,rf:0,n:0});return map.get(k)};
  for(const x of S.movements){
    const mm=effMonth(x);if(mm<from.slice(0,7)||mm>to.slice(0,7)||excl(x)) continue;
    if(x.type==='uscita'){const o=get(x.account||'');o.r+=x.amount;o.n++}
    else if(x.account) get(x.account).rf+=x.amount;
  }
  for(const x of forecastsBetween(from,to)) if(x.type==='uscita'&&!excl(x)) get(x.account||'').f+=x.amount;
  for(const o of map.values()) o.t=round2(o.r+o.f-o.rf);
  return {cards:[...map.values()].filter(o=>o.acc).sort((a,b)=>b.t-a.t),conti:map.get('')||{acc:'',r:0,f:0,rf:0,n:0,t:0}};
}

  return w.slice(0,2).join(' ');
}

}
function niceMax(v){const r=v/4,p=10**Math.floor(Math.log10(r)),n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p*4} // 4 tacche tonde
function drawYearChart(){
  const el=$('#chart');if(!el) return;
  const yd=yearData(V.y),W=Math.max(300,el.clientWidth),H=270,L=54,R=6,T=10,B=26;
  const max=niceMax(Math.max(100,...yd.map(b=>Math.max(b.inR+b.inF,b.outR+b.outF))));
  const iw=W-L-R,ih=H-T-B,gw=iw/12,bw=Math.max(4,Math.min(22,gw*0.32)),Y=v=>T+ih-(v/max)*ih;
  const bar=(x,v,base,fill)=>{if(v<=0) return '';const y1=Y(base+v),y0=Y(base);return `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1)}" rx="2" style="fill:${fill}"/>`};
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrate e uscite per mese nel ${V.y}"><defs>
  <pattern id="hIn" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--in-soft)"/><rect width="2" height="5" style="fill:var(--in)"/></pattern>
  <pattern id="hOut" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--out-soft)"/><rect width="2" height="5" style="fill:var(--out)"/></pattern></defs>`;
  for(let k=0;k<=4;k++){const v=max*k/4,yy=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" class="ax">${eurK(v)} €</text>`}
  yd.forEach((b,i)=>{
    const cx=L+gw*i+gw/2;
    if(i===V.m) s+=`<rect x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${ih}" rx="6" style="fill:var(--accent-soft)"/>`;
    s+=bar(cx-bw-1.5,b.inR,0,'var(--in)')+bar(cx-bw-1.5,b.inF,b.inR,'url(#hIn)');
    s+=bar(cx+1.5,b.outR,0,'var(--out)')+bar(cx+1.5,b.outF,b.outR,'url(#hOut)');
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax ${i===V.m?'axon':''}">${MESI3[i]}</text>`;
    s+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ih+B}" fill="transparent" data-act="pickm" data-m="${i}" data-tip="${i}" style="cursor:pointer"/>`;
  });
  el.innerHTML=s+'</svg>';
  const tip=$('#tip');
  el.onmousemove=e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
    const b=yd[+t.dataset.tip],inn=b.inR+b.inF,out=b.outR+b.outF;
    tip.innerHTML=`<b>${MESI[+t.dataset.tip]} ${V.y}</b><div class="r"><span>Entrate</span><b class="pos">${eur(inn)}</b></div>${b.inF?`<div class="r muted"><span>· di cui previste</span><span>${eur(b.inF)}</span></div>`:''}
      <div class="r"><span>Uscite</span><b class="neg">${eur(out)}</b></div>${b.outF?`<div class="r muted"><span>· di cui previste</span><span>${eur(b.outF)}</span></div>`:''}
      <div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Saldo</span><b>${eur(inn-out)}</b></div>`;
    tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'};
  el.onmouseleave=()=>tip.style.display='none';
}

/* ============ salvadanai ============
   Un movimento verso un salvadanaio ha come categoria "jar:<id>": uscita = metti da parte, entrata = prelevi.
   Non è né una spesa né un guadagno, quindi resta fuori dalle entrate e uscite (come un giroconto). */
const JAR_COLORS=['#d97706','#0891b2','#7c3aed','#16a34a','#db2777','#2563eb'];
const isJar=v=>String(v||'').startsWith('jar:');
const jarOf=v=>isJar(v)?(S.jars||[]).find(j=>'jar:'+j.id===v)||null:null;
const jarSign=m=>m.type==='uscita'?1:-1;
function jarBalance(j,upto){ // saldo del salvadanaio, eventualmente fino a una data
  let b=+j.start||0;
  for(const m of S.movements) if(m.cat==='jar:'+j.id&&(!upto||m.date<=upto)) b+=jarSign(m)*m.amount;
  return round2(b);
}
function jarForecast(j,to){ // saldo previsto a una data, con i versamenti ricorrenti
  let b=jarBalance(j);
  for(const f of forecastsBetween(today(),to)) if(f.cat==='jar:'+j.id&&f.date>=today()) b+=jarSign(f)*f.amount;
  return round2(b);
}
function savedIn(from,to){ // messo da parte (netto) in un periodo di mesi: registrato e previsto
  let r=0,f=0;
  for(const m of S.movements){const mm=effMonth(m);if(isJar(m.cat)&&mm>=from.slice(0,7)&&mm<=to.slice(0,7)) r+=jarSign(m)*m.amount}
  for(const x of forecastsBetween(from,to)) if(isJar(x.cat)) f+=jarSign(x)*x.amount;
  return {r:round2(r),f:round2(f),t:round2(r+f)};
}
function jarMonthly(j){return S.recurring.filter(r=>!r.paused&&(!r.end||r.end>=today())&&r.cat==='jar:'+j.id).reduce((a,r)=>a+jarSign(r)*r.amount*FREQ_M[r.freq],0)}
function viewJar(){

    if(t.type==='open'||t.type==='buy'){qty+=t.qty;fees+=(t.fees||0)*fx;if(t.price==null||!fx) known=false;else cost+=(t.qty*t.price+(t.fees||0))*fx}

    open:ts.find(t=>t.type==='open')||null,opens:ts.filter(t=>t.type==='open'),brokers:[...new Set(ts.map(t=>t.broker||'').filter(Boolean))]};

function syncPositions(){ // riporta su ogni titolo quantità e prezzo medio calcolati dalle operazioni

/* cambio ufficiale BCE (euro per 1 unità di valuta) da frankfurter.dev, con il giorno lavorativo precedente nei festivi */
const fxCache={};
async function fxRate(cur,date){
  if(!cur||cur==='EUR') return 1;const k=cur+date;if(fxCache[k]) return fxCache[k];
  const r=await fetch(`https://api.frankfurter.dev/v1/${date}?base=${cur}&symbols=EUR`);if(!r.ok) throw new Error('cambio BCE non disponibile');
  const v=(await r.json()).rates?.EUR;if(!v) throw new Error('cambio BCE non disponibile');return fxCache[k]=v;
}
function invRows(){
  return (S.positions||[]).filter(p=>!p.archived&&p.qty>0).map(p=>{
    const m=p.kind==='gestita'?{}:mkt(p.id),price=m.price??p.refPrice??null,value=price!=null?round2(p.qty*price):null,cost=p.avg!=null?round2(p.qty*p.avg):null;
    const pl=value!=null&&cost!=null?round2(value-cost):null,day=m.changePct!=null&&value!=null?round2(value-value/(1+m.changePct/100)):null;
    return {p,m,price,value,cost,pl,plPct:pl!=null&&cost?pl/cost*100:null,day,live:m.price!=null};
  }).sort((a,b)=>(b.value||0)-(a.value||0));
}
function invTotals(){

  let realized=0,divs=0;for(const p of S.positions||[]){const st=posStats(p.id);realized+=st.realized||0;divs+=st.divs}

function defaultNewsQuery(name,kind){
  const n=String(name||'');
  if(kind==='etf') return n.replace(/\b(?:EUR|USD|GBP|CHF)?[- ]?hedged\b/gi,' ').replace(/\((acc|dist)\)|\b(USD|EUR|GBP|CHF|UCITS|ETF|Core|iShares|Xtrackers|Vanguard|Amundi|SPDR|Invesco|UBS|Lyxor|Acc|Dist|DR|II)\b/gi,' ').replace(/\s+/g,' ').trim();
  return (n.replace(/\b(Corp\.?|Corporation|Inc\.?|S\.p\.A\.?|SpA|AG|N\.V\.|SE|plc|Ltd\.?|Co\.)\s*$/i,'').trim()+' azioni').trim();
}
const guessKind=name=>/\((acc|dist)\)|\betf\b|ucits/i.test(name)?'etf':/\b(btp|bot|bond|obbligaz|treasury)\b/i.test(name)?'obbligazione':'azione';
/* estratto del patrimonio di Trade Republic: righe "2,466446 pezzi NVIDIA Corp. 142,32 351,02" seguite da "ISIN: ..." */
function parseTRHoldings(lines){
  const out=[];let cur=null,total=null,date='',m;
  for(const t of lines){
    if(!date&&(m=t.match(/al giorno (\d{2})\.(\d{2})\.(\d{4})/i))) date=`${m[3]}-${m[2]}-${m[1]}`;
    if((m=t.match(/^([\d.]+(?:,\d+)?)\s+(?:pezzi|pz\.?)\s+(.+?)\s+([\d.]+,\d+)\s+([\d.]+,\d+)$/i))){cur={qty:parseNum(m[1]),name:m[2].trim(),price:parseNum(m[3]),value:parseNum(m[4]),isin:''};out.push(cur);continue}
    if(cur&&!cur.isin&&(m=t.match(/ISIN:\s*([A-Z]{2}[A-Z0-9]{9}\d)/))) cur.isin=m[1];
    if((m=t.match(/NUMERO DI POSIZIONI:\s*\d+\s+([\d.]+,\d+)\s*EUR/i))) total=parseNum(m[1]);
  }
  const positions=out.filter(p=>p.isin&&p.qty);
  return {date,total,positions,sum:round2(positions.reduce((a,p)=>a+p.value,0))};
}
async function pdfTextLines(file){
  if(!window.pdfjsLib){await loadScript(PDFJS_WORKER);await loadScript(PDFJS_URL);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER}
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;for(const it of items){if(cur&&Math.abs(cur.y-it.y)<=3) cur.items.push(it);else{cur={y:it.y,items:[it]};lines.push(cur)}}
  }
  return lines.map(l=>l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim());
}
/* conferma d'esecuzione di Trade Republic: acquisto, piano d'accumulo, vendita, dividendo */
function parseTRTrade(lines){
  const t=lines.join('\n');let m;
  const r={broker:'Trade Republic',currency:'EUR',fx:1,type:'',date:'',ref:'',isin:'',name:'',qty:null,price:null,amount:null,fees:0,taxes:0,total:null};
  if((m=t.match(/\b(?:ESECUZIONE|ORDINE|OPERAZIONE)\s+([0-9a-f]{4}-[0-9a-f]{4})/i))) r.ref=m[1];
  if((m=t.match(/(?:esecuzione|eseguit\w*|pagamento|distribuzione)[^\n]*?\bil (\d{2})\.(\d{2})\.(\d{4})/i))||(m=t.match(/\bDATA\s+(\d{2})\.(\d{2})\.(\d{4})/))) r.date=`${m[3]}-${m[2]}-${m[1]}`;
  // il tipo si legge dal contenuto, non dal piè di pagina legale ("…esente da imposte sulle vendite…")
  const core=lines.filter(l=>!/UStG|\bIVA\b|imposte sulle vendite|creato automaticamente|registro commerciale|direttore generale/i.test(l)).join('\n');
  r.type=/dividend|distribuzion|cedol|provent/i.test(core)?'div':/\bvendita\b|ordine di vendita|\bsell\b/i.test(core)?'sell':/acquist|piano d.accumulo|piano di accumulo|\bbuy\b|risparmio/i.test(core)?'buy':'';
  for(const l of lines){if((m=l.match(/^(.+?)\s+([\d.]+(?:,\d+)?)\s+Pz\.?\s+([\d.]+,\d+)\s+EUR\s+(-?[\d.]+,\d+)\s+EUR$/i))){r.name=m[1].trim();r.qty=parseNum(m[2]);r.price=parseNum(m[3]);r.amount=Math.abs(parseNum(m[4]));break}}
  if((m=t.match(/ISIN:\s*([A-Z]{2}[A-Z0-9]{9}\d)/))) r.isin=m[1];
  for(const l of core.split('\n')){if((m=l.match(/commission\w*[^\d\n-]*(-?[\d.]+,\d{2})\s*EUR/i))) r.fees+=Math.abs(parseNum(m[1]));
    else if((m=l.match(/\b(?:imposta|ritenuta|tass[ae]|tax)\b[^\d\n-]*(-?[\d.]+,\d{2})\s*EUR/i))&&!/bollo/i.test(l)) r.taxes+=Math.abs(parseNum(m[1]))}
  if((m=t.match(/\bTOTALE\s+(-?[\d.]+,\d{2})\s*EUR/))) r.total=Math.abs(parseNum(m[1]));
  r.fees=round2(r.fees);r.taxes=round2(r.taxes);
  const net=r.type==='buy'?r.amount+r.fees:r.type==='sell'?r.amount-r.fees-r.taxes:r.amount-r.taxes;
  r.ok=!!(r.type&&r.date&&r.isin&&r.qty&&r.price!=null&&r.amount!=null)&&(r.type==='div'||Math.abs(r.qty*r.price-r.amount)<=Math.max(0.05,r.amount*0.002))&&(r.total==null||Math.abs(net-r.total)<0.02);
  return r;
}
/* estratto conto del conto titoli Revolut (in inglese, importi in US$ o €) */
const EN_MON={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
const enNum=s=>{const n=parseFloat(String(s).replace(/[^\d.\-]/g,''));return isFinite(n)?n:null};
const enDate=(d,mo,y)=>EN_MON[mo]?`${y}-${EN_MON[mo]}-${d.padStart(2,'0')}`:'';
const curOf=s=>/US\$/.test(s)?'USD':/€/.test(s)?'EUR':/£/.test(s)?'GBP':'';
function parseRevolut(lines){
  const r={broker:'Revolut',date:'',positions:[],trades:[],totals:{},sums:{},cash:{},grand:{},start:{},flows:[]};let m,sec='';
  for(const l of lines){
    if(!r.date&&(m=l.match(/Period\s+\d{1,2} \w{3} \d{4}\s*-\s*(\d{1,2}) (\w{3}) (\d{4})/))) r.date=enDate(m[1],m[2],m[3]);
    if((m=l.match(/^(USD|EUR|GBP) (?:Portfolio breakdown|Account summary)/))) sec=m[1];
    if(sec&&(m=l.match(/^Total\s+(US\$|€|£)\s?([\d.,]+)\s+(?:US\$|€|£)\s?([\d.,]+)$/))){r.start[curOf(m[1])]=enNum(m[2]);continue}
    if(sec&&(m=l.match(/^Total\s+(US\$|€|£)\s?([\d.,]+)$/))){r.grand[curOf(m[1])]=enNum(m[2]);continue}
    if(sec&&(m=l.match(/^Cash value\s+(US\$|€|£)\s?([\d.,]+)\s+[\d.]+%$/))){r.cash[curOf(m[1])]=enNum(m[2]);continue}
    if((m=l.match(/^(\d{1,2}) (\w{3}) (\d{4}) (\d{2}:\d{2}:\d{2}) GMT\s+(?:Cash )?(top-up|withdrawal)\s+(US\$|€|£)\s?([\d.,]+)/i))){
      r.flows.push({date:enDate(m[1],m[2],m[3]),type:/top/i.test(m[5])?'in':'out',currency:curOf(m[6]),amount:enNum(m[7])});continue}
    if((m=l.match(/^([A-Z0-9.\-]{1,12})\s+(.+?)\s+([A-Z]{2}[A-Z0-9]{9}\d)\s+([\d.,]+)\s+(US\$|€|£)\s?([\d.,]+)\s+(?:US\$|€|£)\s?([\d.,]+)\s+[\d.]+%$/))){
      r.positions.push({symbol:m[1],name:m[2].trim(),isin:m[3],qty:enNum(m[4]),price:enNum(m[6]),value:enNum(m[7]),currency:curOf(m[5])});continue}
    if(sec&&(m=l.match(/^Positions Value\s+(US\$|€|£)\s?([\d.,]+)\s+[\d.]+%$/))) r.totals[curOf(m[1])]=enNum(m[2]);
    if((m=l.match(/^(\d{1,2}) (\w{3}) (\d{4}) (\d{2}:\d{2}:\d{2}) GMT\s+([A-Z0-9.\-]+)\s+(.+?)\s+([\d.,]+)\s+(US\$|€|£)\s?([\d.,]+)\s+(Buy|Sell)\s+(?:US\$|€|£)\s?([\d.,]+)\s+(?:US\$|€|£)\s?([\d.,]+)\s+(?:US\$|€|£)\s?([\d.,]+)$/i))){
      const date=enDate(m[1],m[2],m[3]);
      r.trades.push({broker:'Revolut',currency:curOf(m[8]),type:m[10].toLowerCase()==='sell'?'sell':'buy',date,symbol:m[5],qty:enNum(m[7]),price:enNum(m[9]),amount:enNum(m[11]),fees:round2((enNum(m[12])||0)+(enNum(m[13])||0)),taxes:0,ref:`RV-${date}T${m[4]}-${m[5]}-${m[7]}`});continue}
    if((m=l.match(/^(\d{1,2}) (\w{3}) (\d{4}) (\d{2}:\d{2}:\d{2}) GMT\s+([A-Z0-9.\-]+)\s+.*?dividend.*?(US\$|€|£)\s?([\d.,]+)/i))){
      const date=enDate(m[1],m[2],m[3]);
      r.trades.push({broker:'Revolut',currency:curOf(m[6]),type:'div',date,symbol:m[5],qty:0,price:null,amount:enNum(m[7]),fees:0,taxes:0,ref:`RV-${date}T${m[4]}-${m[5]}-div`})}
  }
  const bySym=new Map(r.positions.map(x=>[x.symbol,x]));
  for(const t of r.trades){const x=bySym.get(t.symbol)||(S.positions||[]).find(p=>(p.symbol||'')===t.symbol);t.isin=x?.isin||'';t.name=x?.name||t.symbol;
    t.ok=!!(t.isin&&t.date&&(t.type==='div'?t.amount:t.qty&&t.price!=null))&&(t.type==='div'||Math.abs(t.qty*t.price-t.amount)<=Math.max(0.05,t.amount*0.005))}
  for(const x of r.positions) r.sums[x.currency]=round2((r.sums[x.currency]||0)+x.value);
  r.ok=Object.keys(r.totals).every(c=>Math.abs((r.sums[c]||0)-r.totals[c])<0.02);
  return r;
}
/* che cosa succede a un'operazione importata: nuova, già presente o già compresa nella situazione iniziale di quel broker */
function tradeStatus(x){
  if(!x.isin&&x.coveredUntil&&x.date&&x.date<=x.coveredUntil) return {key:'before',label:`già compresa: titolo non più posseduto al ${fmtDate(x.coveredUntil)}`};
  if(!x.ok) return {key:'bad',label:'⚠ non riconosciuta: inseriscila a mano'};
  if(x.ref&&(S.trades||[]).some(t=>t.ref===x.ref)) return {key:'dup',label:'già importata'};
  const open=(S.trades||[]).find(t=>t.pos===x.isin&&t.type==='open'&&(t.broker||'')===(x.broker||''));
  if(open&&x.date<=open.date) return {key:'before',label:`già compresa nella situazione al ${fmtDate(open.date)}`};
  return {key:'new',label:'nuova'};
}
async function importTRFiles(files){
  const trades=[];
  for(const f of files){
    let lines;try{lines=await pdfTextLines(f)}catch(e){await notice(`Non sono riuscito a leggere ${f.name}: ${e.message}`,'File non letto');continue}
    if(lines.some(l=>/Revolut Securities/i.test(l))){
      const r=parseRevolut(lines);
      if(!r.positions.length&&!r.trades.length){await notice(`In ${f.name} non ho trovato titoli né operazioni.`,'Estratto Revolut');continue}
      try{
        const curs=[...new Set([...r.positions.map(x=>x.currency),...r.trades.map(t=>t.currency)])].filter(c=>c&&c!=='EUR');
        const fxEnd={};for(const c of curs) fxEnd[c]=await fxRate(c,r.date);r.fxEnd=fxEnd;
        for(const x of r.positions){x.fx=fxEnd[x.currency]||1;x.priceEur=round2(x.price*x.fx*1e4)/1e4}
        for(const t of r.trades) t.fx=await fxRate(t.currency,t.date);
      }catch(e){await notice('Non riesco a leggere il cambio BCE: '+e.message+'. Riprova con la connessione attiva.','Cambio non disponibile');continue}
      const g=managedFor(r),fresh=r.positions.length&&!r.positions.some(x=>(S.trades||[]).some(t=>t.pos===x.isin&&(t.broker||'').startsWith('Revolut')));
      if(g||(fresh&&await askRevolutMode(r)==='gestita')){await importManaged(r,g);continue}
      let acc=suggestAccount(r),first=false;
      if(r.positions.length){const res=await importHoldings(r);if(!res) continue;acc=res.acc;first=res.first}
      trades.push(...r.trades.map(t=>({...t,broker:acc,file:f.name,...(first?{coveredUntil:r.date}:{})})));continue}
    if(lines.some(l=>/ESTRATTO DEL PATRIMONIO/i.test(l))){const r=parseTRHoldings(lines);r.broker='Trade Republic';r.positions.forEach(x=>{x.currency='EUR';x.fx=1;x.priceEur=x.price});await importHoldings(r);continue}
    trades.push({...parseTRTrade(lines),file:f.name});
  }
  if(trades.length) showTradesDialog(trades);
}

/* nome del conto: Revolut può avere più conti con lo stesso numero, ognuno va tenuto separato */
function suggestAccount(r){
  const base=r.broker||'Trade Republic';if(base==='Trade Republic') return base;
  const labels=[...new Set((S.trades||[]).map(t=>t.broker||'').filter(b=>b===base||b.startsWith(base+' ')))];
  let best='',score=0;for(const l of labels){const s=r.positions.filter(x=>tradesOf(x.isin,l).length).length;if(s>score){score=s;best=l}}
  if(best) return best;if(!labels.length) return base;
  let i=2;while(labels.includes(`${base} ${i}`)) i++;return `${base} ${i}`;
}
/* estratto del patrimonio (Trade Republic) o del conto titoli (Revolut): crea la situazione iniziale dei titoli nuovi e controlla gli altri.
   Restituisce il nome del conto usato (o null se annullato) e se era la prima importazione di quel conto. */
async function importHoldings(r){
  const broker=suggestAccount(r),askName=(r.broker||'Trade Republic')!=='Trade Republic';
  if(!r.positions.length) return notice("Nel PDF non ho trovato titoli. Serve l'estratto con l'elenco dei titoli posseduti.",'Nessun titolo trovato');
  const lines=r.positions.map(x=>{const hasOps=tradesOf(x.isin,broker).length>0,st=hasOps?posStats(x.isin,broker):null;
    return {...x,hasOps,status:!hasOps?`situazione iniziale al ${fmtDate(r.date)}`:Math.abs(st.qty-x.qty)<1e-6?'✔ coincide con le operazioni':`⚠ le operazioni danno ${qtyFmt(st.qty)}, l'estratto ${qtyFmt(x.qty)}: manca un'operazione?`,warn:hasOps&&Math.abs(st.qty-x.qty)>=1e-6}});
  const gone=(S.positions||[]).filter(p=>!p.archived&&posStats(p.id,broker).qty>0&&!r.positions.some(x=>x.isin===p.id));
  const cur=r.positions[0]?.currency||'EUR';
  const okMsg=r.totals?(r.ok?`✔ I conti tornano: ${r.positions.length} titoli per ${Object.entries(r.sums).map(([c,v])=>money(v,c)).join(' + ')}, come il totale del documento.`:`⚠ La somma dei titoli letti non coincide con il totale del documento: controlla prima di confermare.`)
    :(r.total==null||Math.abs(r.total-r.sum)<0.02?`✔ I conti tornano: ${r.positions.length} titoli per ${eur(r.sum)}, come il totale del documento.`:`⚠ La somma dei titoli letti (${eur(r.sum)}) non coincide con il totale del documento (${eur(r.total)}): controlla prima di confermare.`);
  const ok=okMsg.startsWith('✔');
  return new Promise(res=>{openDlg(`<form><div class="dlg-h"><h3>${esc(broker)}: titoli al ${fmtDate(r.date)}</h3><button type="button" class="btn ghost" data-act="close" aria-label="Chiudi">✕</button></div>
  <div style="padding:12px 16px;display:grid;gap:10px">
    <div class="banner ${ok?'ok':''}"><div>${okMsg}</div></div>
    ${askName?`<label class="lab">Nome del conto (per tenere separati i conti dello stesso broker)<input id="accLabel" name="acc" value="${esc(broker)}" list="accNames"></label>
      <datalist id="accNames">${[...new Set((S.trades||[]).map(t=>t.broker).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`:''}
    <div class="tblwrap"><table class="small"><thead><tr><th>Titolo</th><th class="num">Quantità</th><th class="num">Valore</th><th>Confronto</th></tr></thead><tbody>
    ${lines.map(x=>`<tr><td>${esc(x.name)}<div class="muted">${x.isin}</div></td><td class="num">${qtyFmt(x.qty)}</td><td class="num">${money(x.value,x.currency)}${x.currency!=='EUR'?`<div class="muted">${eur(x.value*x.fx)}</div>`:''}</td><td class="${x.warn?'neg':''}">${esc(x.status)}</td></tr>`).join('')}
    ${gone.map(p=>`<tr><td>${esc(p.name)}<div class="muted">${esc(p.isin)}</div></td><td class="num">0</td><td></td><td class="neg">⚠ non più presente: registra la vendita</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin:0">I titoli che presso ${esc(broker)} hanno già delle operazioni non vengono modificati: l'estratto serve da controllo. Per quelli nuovi registro la situazione iniziale con la quantità dell'estratto; il prezzo medio lo inserisci tu dalla scheda del titolo${cur!=='EUR'?', nella valuta del broker':''}.</p>
  </div><div class="dlg-f"><button type="button" class="btn" data-act="close">Annulla</button><button class="btn primary">Conferma</button></div></form>`,
  fd=>{
    const acc=askName?(String(fd.get('acc')||'').trim()||broker):broker,first=!(S.trades||[]).some(t=>t.broker===acc);
    S.positions=[...(S.positions||[])];S.trades=[...(S.trades||[])];
    for(const x of lines){const i=S.positions.findIndex(p=>p.id===x.isin),o=i>=0?S.positions[i]:null,kind=o?.kind||guessKind(x.name);x.hasOps=tradesOf(x.isin,acc).length>0;
      const np={...(o||{}),id:x.isin,isin:x.isin,name:o?.name||x.name,kind,qty:o?.qty||0,avg:o?.avg??null,refPrice:x.priceEur??x.price,refDate:r.date,broker:o?.broker||broker,archived:false,newsQuery:o?.newsQuery||defaultNewsQuery(x.name,kind),...(x.symbol?{symbol:x.symbol}:{})};
      if(i>=0) S.positions[i]=np;else S.positions.push(np);
      if(!x.hasOps) S.trades.push({id:uid(),pos:x.isin,date:r.date,type:'open',qty:x.qty,price:null,amount:null,fees:0,taxes:0,src:acc==='Trade Republic'?'Estratto del patrimonio':'Estratto '+acc,ref:'',broker:acc,currency:x.currency||'EUR',fx:x.fx||1});
    }
    syncPositions();save();toast('Portafoglio aggiornato');setTimeout(()=>refreshMarket(false),300);
    result={acc,first};

function managedValue(r){ // valore in euro alla fine del periodo: titoli + liquidità, e i versamenti del periodo

  for(const i of S.imports) if(i.account===from) i.account=to;
  S.holders={...(S.holders||{})};const kf=accKey(from),kt=accKey(to);

function parseNum(v){
  if(v==null||v==='') return null;if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v).trim().replace(/\u2212/g,'-').replace(/[\s ']/g,'').replace(/€|EUR/gi,''),neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1)}else if(s.endsWith('+')) s=s.slice(0,-1);
  if(s.startsWith('-')){neg=!neg;s=s.slice(1)}else if(s.startsWith('+')) s=s.slice(1);
  if(!/^[\d.,]+$/.test(s)||!/\d/.test(s)) return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0) s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(lc>=0){const p=s.split(',');s=p.length===2?p[0]+'.'+p[1]:p.join('')}
  else if(ld>=0&&(/^[1-9]\d{0,2}(\.\d{3})+$/.test(s)||s.split('.').length>2)) s=s.replace(/\./g,''); // 1.234 = milleduecentotrentaquattro
  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n);
}
const MESI_TXT={gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12,jan:1,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,dec:12};
function parseDate(v,fmt){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:iso(new Date(v.getTime()+12*36e5));
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}return null}
  const s=String(v).trim();let m,y,mo,d;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3]}
  else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})(?!\d)/))){d=+m[1];mo=+m[2];y=+m[3];if(fmt==='mdy')[d,mo]=[mo,d];if(y<100)y+=2000}
  else if((m=s.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3,})\.?[\s\-]+(\d{4}|\d{2})/))){d=+m[1];mo=MESI_TXT[m[2].slice(0,3).toLowerCase()];y=+m[3];if(y<100)y+=2000}
  else return null;
  if(!mo||mo>12||d<1||y<1990||y>2100||d>new Date(y,mo,0).getDate()) return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
async function readText(file){const b=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(b);if(t.includes('\uFFFD')) t=new TextDecoder('windows-1252').decode(b);return t}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const sample=text.split(/\r?\n/).slice(0,40);let delim=';',best=-1;
  for(const d of [';',',','\t','|']){
    const counts=sample.map(l=>l.split(d).length-1).filter(n=>n>0);if(!counts.length) continue;
    const freq={};counts.forEach(n=>freq[n]=(freq[n]||0)+1);
    const [mode,f]=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];const score=f*Math.min(+mode,12);
    if(score>best){best=score;delim=d}
  }
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell.trim()==='') {q=true;cell=''}
    else if(ch===delim){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n') i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}
async function parseXLSX(file){
  if(!window.XLSX) await loadScript(XLSX_URL);
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});let best=[];
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(r.length>best.length) best=r}
  return best.map(r=>r.map(c=>c instanceof Date||typeof c==='number'?c:String(c??'').trim())).filter(r=>r.some(c=>c!==''&&c!=null));
}

const PDF_AMT=/^[-+−]?\s?(?:€\s?)?(?:\d{1,3}(?:[.'\s]\d{3})+|\d+)[,.]\d{2}\s?[-+]?(?:\s?(?:€|EUR))?$/i;
function mergeSigns(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const it=items[i],nx=items[i+1];
    if(/^[-+−]$/.test(it.s)&&nx&&PDF_AMT.test(nx.s)&&nx.x-(it.x+it.w)<40){out.push({...nx,s:(it.s==='+'?'':'-')+nx.s,x:it.x,w:nx.x+nx.w-it.x});i++}

  }

}
async function parsePDF(file){

  const AMT=PDF_AMT;

  // intestazioni di colonna: dove stanno gli importi (e quali colonne ignorare: altre valute, cambio, saldo)
  const hdr={skip:[]},norm=s=>s.toLowerCase().replace(/[^a-zà-ù€ ]/g,'').replace(/\s+/g,' ').trim();
  const isAmtHdr=t=>/^(dare|addebiti|uscite|importo addebiti|debiti|addebito|avere|accrediti|entrate|importo accrediti|crediti|accredito|importo|importi|amount|importo in euro|importo eur|importo €|euro)$/.test(t);

/* stato di un estratto in un mese: ok (importato), manual (segnato a mano), due (mese appena finito), missing, next (mese in corso), before */
function docStatus(d,ym){

/* un estratto della carta conta tutto nel suo mese: quello in cui cadono quasi tutte le spese */
function stmtMonth(items){
  const ds=items.map(x=>x.date).sort();if(!ds.length) return '';
  if((pISO(ds[ds.length-1])-pISO(ds[0]))/864e5>45) return ''; // più di un mese: non è un estratto mensile
  const c={};ds.forEach(d=>{const k=d.slice(0,7);c[k]=(c[k]||0)+1});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||(b[0]<a[0]?-1:1))[0][0];
}
function buildItems(){
  const {rows,hdr,map,invert,fmt}=IMP,items=[];
  const exact=new Map(),loose=new Map(),inc=(M,k)=>M.set(k,(M.get(k)||0)+1),take=(M,k)=>{const n=M.get(k)||0;if(n) M.set(k,n-1);return n>0};
  const acc=resolveAcc(IMP.account),accs=new Set([acc]); // si confronta solo con lo stesso conto o carta: una carta con sé stessa, i conti (senza carta) con i conti
  if(isContoAcc(acc)) accs.add(''); // un conto corrente con un nome: prima i suoi movimenti potevano essere senza conto
  for(const m of S.movements){if(!accs.has(m.account||'')) continue;const a=m.amount.toFixed(2);inc(exact,m.date+'|'+m.type+'|'+a+'|'+learnKey(m.desc));inc(loose,m.date+'|'+m.type+'|'+a)}
  rows.slice(hdr+1).forEach((r,ri)=>{
    const date=parseDate(r[map.date],fmt);if(!date) return;
    const desc=[r[map.desc],map.desc2>=0?r[map.desc2]:''].map(x=>x instanceof Date?'':String(x??'').trim()).filter(Boolean).join(' · ');
    let v=null;
    if(map.mode==='split'){const o=parseNum(r[map.out]),i=parseNum(r[map.inn]);if(o) v=-Math.abs(o);else if(i) v=Math.abs(i);else if(map.amount>=0) v=parseNum(r[map.amount])}
    else{v=parseNum(r[map.amount]);if(v!=null&&invert) v=-v}
    if(v==null||Math.abs(v)<0.005) return;
    const type=v<0?'uscita':'entrata',amount=round2(Math.abs(v)),a=amount.toFixed(2);
    const kl=date+'|'+type+'|'+a,dup=take(exact,kl+'|'+learnKey(desc))?(take(loose,kl),'si'):take(loose,kl)?'forse':'';
    // solo i doppioni certi (stessa carta, data, importo ed esercente) partono deselezionati
    items.push({ri,sel:dup!=='si',date,desc:desc||'(senza descrizione)',amount,type,cat:guessCat(desc,type),dup});
  });
  const d=docById(IMP.docId),words=ruleWords(d);
  if(d) for(const x of items){const w=words.find(w=>x.desc.toLowerCase().includes(w));
    x.rule=d.onlyOut&&x.type==='entrata'?'è un\'entrata':w?`contiene «${w}»`:'';if(x.rule) x.sel=false}
  IMP.items=items;
  if(IMP.meseAuto!==false) IMP.mese=(IMP.account||'').trim()&&d?.kind!=='conto'&&!isContoAcc(acc)?stmtMonth(items):'';
}
/* riconciliazione permanente: i movimenti di ogni importazione devono continuare a sommare al totale dell'estratto */
function impCheck(i){
  if(!i.stmt) return null;
  const ms=S.movements.filter(m=>m.imp===i.id),out=ms.filter(m=>m.type==='uscita').reduce((a,b)=>a+b.amount,0)+(i.ruled?.out||0)+(i.dups?.out||0),inn=ms.filter(m=>m.type==='entrata').reduce((a,b)=>a+b.amount,0)+(i.ruled?.inn||0)+(i.dups?.inn||0);
  const calc=round2(i.stmt.what==='somma delle uscite'?out:i.stmt.what==='somma delle entrate'?inn:inn-out),diff=round2(Math.abs(calc)-Math.abs(i.stmt.value));
  return {calc,diff,ok:Math.abs(diff)<0.005};
}

function bindImp(){
  const d=$('#drop'),fi=$('#fileIn');if(!d) return;
  fi.onchange=()=>{if(fi.files[0]) handleFile(fi.files[0]);fi.value=''};
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f) handleFile(f)};
  const a=$('#impAcc');a.onchange=()=>{V.lastAcc=a.value.trim();if(IMP&&!IMP.loading){IMP.account=V.lastAcc;buildItems();render()}};
  const sd=$('#impDoc');if(sd) sd.onchange=()=>{const d=docById(sd.value);if(!IMP||IMP.loading){V.impDoc=sd.value;if(d){a.value=d.account||'';V.lastAcc=a.value}return}
    IMP.docId=sd.value;IMP.docAuto=false;if(d){IMP.account=resolveAcc(d.account);a.value=IMP.account}buildItems();render()};

async function doImport(){
  const sel=IMP.items.filter(i=>i.sel);if(!sel.length) return;
  const rc=reconcile(),best=rc.checks.find(c=>c.ok),skip=IMP.items.filter(x=>!x.sel&&x.dup!=='si'&&!x.rule),rl=IMP.items.filter(x=>!x.sel&&x.rule);
  if(rc.status==='diff'&&!await ask('La somma dei movimenti non coincide con i totali del documento.\nImportare comunque?',{title:'I conti non tornano',ok:'Importa comunque'})) return;
  if(skip.length&&!await ask(`${skip.length} ${skip.length===1?'riga non verrà importata':'righe non verranno importate'}: il totale nel riepilogo sarà diverso da quello dell'estratto conto.\nImportare comunque?`,{title:'Righe escluse',ok:'Importa comunque'})) return;
  const stmt=best?{label:best.label,value:best.doc,what:best.what}:null;
  const acc=resolveAcc($('#impAcc')?.value||IMP.account||''),id=uid(),months=IMP.period?monthsIn(IMP.period.from,IMP.period.to):coveredMonths(sel.map(x=>IMP.mese||x.date.slice(0,7)));
  const sums=xs=>({out:round2(xs.filter(x=>x.type==='uscita').reduce((a,x)=>a+x.amount,0)),inn:round2(xs.filter(x=>x.type==='entrata').reduce((a,x)=>a+x.amount,0)),n:xs.length});
  const ruled=rl.length?sums(rl):null,dl=IMP.items.filter(x=>!x.sel&&x.dup==='si'&&!x.rule),dups=dl.length?sums(dl):null; // righe del documento non importate: servono al controllo dei totali
  for(const x of sel){S.movements.push({id:uid(),date:x.date,desc:x.desc,amount:x.amount,type:x.type,cat:x.cat,account:acc,note:'',imp:id,...(IMP.mese&&IMP.mese!==x.date.slice(0,7)?{mese:IMP.mese}:{})});if(x.cat) learn(x.desc,x.cat)}
  S.imports.unshift({id,date:today(),ts:Date.now(),file:IMP.file,account:acc,count:sel.length,check:rc.status,months,...(IMP.docId?{docId:IMP.docId}:{}),...(ruled?{ruled}:{}),...(dups?{dups}:{}),...(stmt&&!skip.length?{stmt}:{})});
  const dd=docById(IMP.docId);if(dd&&!dd.freq&&months.length>=3) dd.freq='q';
  if(acc) V.lastAcc=acc;
  IMP=null;V.impDoc='';V.tab='mov';V.f={q:'',month:'',type:'',cat:'',acc:acc||'',fc:true};
  save();toast(`Importati ${sel.length} movimenti`);
}

    else if(k==='invert') IMP.invert=a.checked;
    else if(k==='mode'){IMP.map.mode=a.value;if(a.value==='split'&&(IMP.map.out<0||IMP.map.inn<0)){IMP.map.out=IMP.map.out<0?0:IMP.map.out;IMP.map.inn=IMP.map.inn<0?0:IMP.map.inn}}
    else IMP.map[k]=+a.value;
    buildItems();render()},
  it:a=>{const x=IMP.items[+a.dataset.i],k=a.dataset.k;
    if(k==='sel') x.sel=a.checked;
    else if(k==='type'){x.type=a.value;const c=cat(x.cat);if(c&&c.kind!==x.type&&c.kind!=='giroconto') x.cat=guessCat(x.desc,x.type)}
    else{x.cat=a.value;const key=learnKey(x.desc);if(key&&a.value){let n=0;IMP.items.forEach(o=>{if(o!==x&&!o.cat&&o.type===x.type&&learnKey(o.desc)===key){o.cat=a.value;n++}});if(n) toast(`Assegnata anche a ${n} righe simili`)}}
    render()},
  itall:a=>{if(!a.value) return;const c=cat(a.value),jar=jarOf(a.value);let n=0;IMP.items.forEach(x=>{if(x.sel&&(jar||c.kind===x.type||c.kind==='giroconto')){x.cat=a.value;n++}});toast(`Categoria assegnata a ${n} righe`);render()},
};
document.addEventListener('change',e=>{const a=e.target.closest('[data-chg]');if(a&&CHG[a.dataset.chg]) CHG[a.dataset.chg](a,e)});
let qT;document.addEventListener('input',e=>{if(e.target.id==='q'){clearTimeout(qT);qT=setTimeout(()=>{V.f.q=e.target.value;V.limit=300;renderMovList()},150)}});
$('#invFile').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length) importTRFiles(fs)});
$('#jsonIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f) return;
  let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.movements)) throw 0}catch{return notice('Il file non è un archivio valido di Spese Mensili.','File non valido')}
  if(!await ask(`Il file contiene ${d.movements.length} movimenti e ${(d.recurring||[]).length} ricorrenti.\nSostituiscono i dati attuali, per tutti.`,{title:'Importa archivio',ok:'Importa'})) return;
  const n=normalize(d);for(const k of ['categories','movements','recurring','learn','imports','holders','accAlias','docs','docMarks','jars','positions','trades']) S[k]=n[k];
  S.movements.forEach(m=>{if(!m.id) m.id=uid()});S.recurring.forEach(r=>{if(!r.id) r.id=uid()});
  save();toast(`Importati ${S.movements.length} movimenti`)});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(V.tab==='dash') drawYearChart()},120)});

render();
init();
addEventListener('online',()=>{if(DB.user&&DB.state==='offline') start(DB.user)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DB.state==='ok'&&!DB.pending) refresh()}); // l'iPhone sospende le app in background
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
